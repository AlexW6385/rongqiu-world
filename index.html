<title>绒球世界</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
/* Layout: the world fills the screen. A location plaque sits top-left like a museum label; two round instruments sit top-right
   (map, settings). The map opens as a full-screen chart with a gazetteer beside it. Single dark look on purpose: the chrome is a
   quiet ink frame around a lit or unlit planet. */
:root{
  --ink:#070a11;--glass:rgba(9,13,21,.56);--glass-hi:rgba(13,18,29,.86);--line:rgba(220,228,242,.12);--line-hi:rgba(233,207,152,.42);
  --text:#eef1f6;--dim:#9aa4b5;--faint:#687286;--gold:#e9cf98;--gold-dim:#b9a271;--cyan:#8fd3ff;--sea:#0a1727;
  --serif:"Noto Serif SC","Songti SC",Georgia,serif;
  --sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

/* location plaque */
#plaque{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:max(18px,env(safe-area-inset-left,0px));pointer-events:none;
  padding:12px 16px 12px 15px;border-left:1px solid var(--line-hi);background:linear-gradient(90deg,rgba(7,10,17,.55),rgba(7,10,17,0));max-width:min(74vw,420px)}
#plaque .brand{font-family:var(--serif);font-size:11px;letter-spacing:.42em;color:var(--gold-dim);margin-bottom:8px}
#plaque .region{font-size:11px;letter-spacing:.22em;color:var(--dim)}
#plaque .name{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:.06em;line-height:1.3;color:var(--text);text-shadow:0 1px 12px rgba(0,0,0,.6);margin-top:2px;text-wrap:balance}
#plaque .sub{font-size:12px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px rgba(0,0,0,.8)}
#plaque .clock{display:flex;align-items:center;gap:9px;margin-top:10px;font-variant-numeric:tabular-nums}
#plaque .clock svg{width:30px;height:30px;flex:none}
#plaque .clock b{font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.04em}
#plaque .clock span{font-size:12px;color:var(--dim);letter-spacing:.12em}

/* top-right instruments */
#tools{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;z-index:5}
.tool{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:grid;place-items:center;cursor:pointer;color:var(--text);transition:border-color .2s,background .2s}
.tool:hover,.tool[aria-expanded=true]{border-color:var(--line-hi);background:var(--glass-hi)}
.tool svg{width:21px;height:21px}
.tool.muted .w,.tool:not(.muted) .s{display:none}
.tool.muted{color:var(--dim)}
#settings{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 32px));z-index:6;
  background:var(--glass-hi);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px}
#settings[hidden]{display:none}
#settings h2{font-family:var(--serif);font-weight:500;font-size:15px;letter-spacing:.2em;margin:0 0 12px;color:var(--gold)}
.field{display:grid;grid-template-columns:3em 1fr 3.4em;align-items:center;gap:10px;margin:10px 0;font-size:12px}
.field>span{color:var(--dim);letter-spacing:.1em}
.field output{text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;margin:0;accent-color:var(--gold);height:22px}
select{width:100%;background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:12px;padding:5px 8px}
.note{font-size:11px;color:var(--faint);margin:-4px 0 10px 4.1em;line-height:1.5}
.keys{border-top:1px solid var(--line);margin-top:12px;padding-top:11px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:11.5px;color:var(--dim);align-items:center}
.keys kbd{font-family:var(--sans);font-size:10.5px;color:var(--text);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;justify-self:start;white-space:nowrap}

/* hint toast */
#hint{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:9px 18px;border-radius:999px;background:var(--glass);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);font-size:12px;color:var(--dim);letter-spacing:.06em;white-space:nowrap;pointer-events:none;transition:opacity 1.2s;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#hint.off{opacity:0}

/* touch stick */
#stick{position:fixed;left:max(28px,env(safe-area-inset-left,0px));bottom:calc(36px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;
  border:1px solid var(--line);background:radial-gradient(circle,rgba(233,207,152,.06),rgba(9,13,21,.35));display:none;touch-action:none}
#stick i{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:rgba(233,207,152,.32);border:1px solid var(--line-hi)}
body.touch #stick{display:block}
body.touch #hint{bottom:calc(160px + env(safe-area-inset-bottom,0px))}

/* loading + errors */
#load{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 60%,#101826,var(--ink) 70%);font-family:var(--serif);letter-spacing:.5em;color:var(--gold-dim);font-size:14px;transition:opacity 1s;z-index:30}
#load.off{opacity:0;pointer-events:none}
#err{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);max-width:34em;background:var(--glass-hi);border:1px solid var(--line);padding:16px 20px;border-radius:10px;line-height:1.6;font-size:13px;z-index:31}

/* ---------- map ---------- */
#map{position:fixed;inset:0;z-index:20;background:rgba(5,8,14,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#map[hidden]{display:none}
.mh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:12px}
.mh h2{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.32em;margin:0;color:var(--gold)}
.mh p{margin:4px 0 0;font-size:12px;color:var(--dim);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.mctl{display:flex;gap:8px;flex:none}
.mctl button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);cursor:pointer;display:grid;place-items:center}
.mctl button:hover{border-color:var(--line-hi)}
.mctl svg{width:17px;height:17px}
.mbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.stage{position:relative;overflow:hidden;min-width:0;border-radius:10px;background:var(--sea);border:1px solid var(--line);touch-action:none;cursor:grab;min-height:0}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;--iz:1}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#night{mix-blend-mode:normal;pointer-events:none}
#mapLoading[hidden]{display:none}
#mapLoading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);letter-spacing:.4em;color:var(--gold-dim);font-size:13px;pointer-events:none}
.pin{position:absolute;width:0;height:0}
.pin>.in{position:absolute;left:0;top:0;transform:scale(var(--iz));transform-origin:0 0;pointer-events:none}
.pin i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:1.5px solid rgba(7,10,17,.9);box-shadow:0 0 0 3px rgba(233,207,152,.12);pointer-events:auto;cursor:pointer}
.pin span{position:absolute;left:9px;top:-10px;white-space:nowrap;font-size:12.5px;color:#f3efe6;letter-spacing:.04em;pointer-events:auto;cursor:pointer;
  text-shadow:0 0 3px #071019,0 0 6px #071019,0 1px 2px #071019}
.pin.t1 i{display:none}
.pin.t1 span{left:0;top:0;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.38em;color:rgba(240,226,190,.9)}
.pin.sel i{background:#fff;box-shadow:0 0 0 5px rgba(233,207,152,.35)}
.pin.sel span{color:var(--gold);font-weight:500}
.world[data-z="1"] .pin.t2 span,.world[data-z="1"] .pin.t3 span,.world[data-z="2"] .pin.t3 span{display:none}
.world .pin.sel span{display:block!important}
.mk{position:absolute;width:0;height:0}
.mk>.in{position:absolute;left:0;top:0;transform:scale(var(--iz));transform-origin:0 0;pointer-events:none}
.mk.sun .in::before{content:"";position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#fff6d8 0 35%,rgba(255,214,120,.55) 36% 60%,rgba(255,200,90,0) 61%)}
.mk.moon .in::before{content:"";position:absolute;left:-6px;top:-6px;width:12px;height:12px;border-radius:50%;background:#dfe6f2;box-shadow:inset -4px -2px 0 rgba(20,30,50,.75),0 0 8px rgba(200,215,255,.6)}
#me{position:absolute;width:0;height:0}
#me>.in{position:absolute;left:0;top:0;transform:scale(var(--iz));transform-origin:0 0;pointer-events:none}
#me .ring{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(143,211,255,.8);animation:ping 2.4s ease-out infinite}
#me .arrow{position:absolute;left:-9px;top:-11px;width:18px;height:22px;transform-origin:9px 11px}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){#me .ring{animation:none}#load,#hint{transition:none}}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 10px;padding:7px 10px;border-radius:8px;background:rgba(7,10,17,.72);font-size:10.5px;color:var(--dim);pointer-events:none;max-width:calc(100% - 20px)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.gaz{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.gaz input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--text);font:inherit;font-size:13px;padding:9px 12px}
.gaz input::placeholder{color:var(--faint)}
#card{border:1px solid var(--line-hi);border-radius:12px;padding:14px 16px;background:linear-gradient(160deg,rgba(233,207,152,.08),rgba(233,207,152,.02))}
#card[hidden]{display:none}
#card .cr{font-size:11px;letter-spacing:.2em;color:var(--dim)}
#card h3{font-family:var(--serif);font-weight:600;font-size:20px;letter-spacing:.08em;margin:3px 0 6px;color:var(--gold)}
#card p{margin:0;font-size:12.5px;line-height:1.75;color:var(--text)}
#card .cm{margin-top:8px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
#card .go{margin-top:12px;width:100%;padding:10px;border-radius:9px;border:1px solid var(--line-hi);background:rgba(233,207,152,.14);color:var(--gold);letter-spacing:.3em;cursor:pointer;font-size:13px}
#card .go:hover{background:rgba(233,207,152,.24)}
#gazList{overflow:auto;min-height:0;flex:1;padding-right:4px;scrollbar-width:thin}
#gazList h4{font-family:var(--serif);font-weight:500;font-size:13px;letter-spacing:.24em;color:var(--gold-dim);margin:14px 0 6px;display:flex;justify-content:space-between}
#gazList h4:first-child{margin-top:2px}
#gazList h4 span{font-family:var(--sans);letter-spacing:0;color:var(--faint);font-size:11px}
.gi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 9px;cursor:pointer;color:var(--text);font-size:13px}
.gi small{display:block;color:var(--faint);font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi:hover,.gi.sel{background:rgba(233,207,152,.08)}
.gi.sel{color:var(--gold)}
@media (max-width:760px){
  .mbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .stage{aspect-ratio:2/1;width:100%}
  .mh h2{font-size:18px}
  .mh p{font-size:11px}
  .legend{display:none}
  #plaque{padding:10px 12px}
  #plaque .name{font-size:19px}
  #plaque .brand{display:none}
}
</style>

<canvas id="c"></canvas>
<div id="plaque" aria-live="polite">
  <div class="brand">绒球世界</div>

</div>
<div id="settings" hidden>
  <h2>观测设置</h2>

  <div class="keys" id="keys">

</div>
<div id="hint">拖动画面转头 · WASD 行走 · Shift 奔跑 · 滚轮调速 · M 打开地图</div>
<div id="stick" aria-hidden="true"><i></i></div>
<div id="map" hidden role="dialog" aria-modal="true" aria-label="绒球全图">
  <header class="mh">

    <div class="mctl">
      <button type="button" id="zIn" aria-label="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

      <button type="button" id="zMe" aria-label="回到我的位置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4" stroke-linecap="round"/></svg></button>
      <button type="button" id="mapClose" aria-label="关闭地图"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </header>
  <div class="mbody">
    <div class="stage" id="stage">
      <div class="world" id="world" data-z="1">
        <canvas id="mapc" width="1440" height="720"></canvas>

        <div class="mk moon" id="moonMk"><div class="in"></div></div>

      </div>
      <div id="mapLoading">正在测绘全图</div>
      <div class="legend"><span><b style="background:#123651"></b>深海</span><span><b style="background:#3f8a96"></b>浅海</span><span><b style="background:#5f7d3e"></b>平原</span><span><b style="background:#335c34"></b>森林</span><span><b style="background:#c9ad78"></b>荒漠</span><span><b style="background:#8f7a5c"></b>山地</span><span><b style="background:#e9eef3"></b>冰雪</span></div>

      <div id="gazList"></div>
    </aside>
  </div>
</div>

function ctxAt(lat,lon){const n=fromLL(lat,lon,1);const h=T.terrain(n.x,n.y,n.z,2);const dl=3/(R*Math.cos(lat));const hx=T.terrain(...Object.values(fromLL(lat,lon+dl,1)),2);return {n,h,moist:T.moisture(n.x,n.y,n.z),dry:T.dryness(n.x,n.y,n.z),region:T.regionIdx(n.x,n.y,n.z),slope:Math.abs(hx-h)/3};}
let spawnT=0;
function spawnNear(){
  if(CREATURES.length>=MAXC)return;
  const ang=Math.random()*6.283,dist=(120+Math.random()*500)/R;
  const lat=view.lat+Math.cos(ang)*dist,lon=view.lon+Math.sin(ang)*dist/Math.cos(view.lat);
  const c=ctxAt(lat,lon);
  const cands=Object.keys(SPECIES).filter(k=>SPECIES[k].ok(c));if(!cands.length)return;
  const key=cands[Math.floor(Math.random()*cands.length)];const sp=SPECIES[key];
  const cnt=sp.group[0]+Math.floor(Math.random()*(sp.group[1]-sp.group[0]+1));
  const heading=Math.random()*6.283;
  for(let i=0;i<cnt&&CREATURES.length<MAXC;i++){const o=sp.make();fauna.add(o);
    CREATURES.push({sp,key,obj:o,lat:lat+(Math.random()-.5)*20/R,lon:lon+(Math.random()-.5)*20/R,heading:heading+(Math.random()-.5)*.6,alt:sp.fly?sp.fly[0]+Math.random()*(sp.fly[1]-sp.fly[0]):0,ph:Math.random()*6.283,t:0});}
}
const _fwd=new THREE.Vector3(),_rgt=new THREE.Vector3(),_mat=new THREE.Matrix4();
function updateCreatures(dt){
  const nearGround=true;
  spawnT-=dt;if(nearGround&&spawnT<=0){spawnT=1.5;spawnNear();}
  for(let i=CREATURES.length-1;i>=0;i--){const c=CREATURES[i],sp=c.sp;c.t+=dt;
    const dlat=(c.lat-view.lat)*R,dlon=(c.lon-view.lon)*R*Math.cos(view.lat);const d=Math.hypot(dlat,dlon);
    if(d>1100||!nearGround){fauna.remove(c.obj);CREATURES.splice(i,1);continue;}
    c.heading+=(Math.sin(c.t*.7+c.ph)*.6+(Math.random()-.5))*sp.turn*dt;
    if(d>700)c.heading=Math.atan2(-dlon,-dlat)+Math.sin(c.t)*.3;   // drift back toward the viewer
    const {up,east,north}=frameAt(c.lat,c.lon);
    _fwd.copy(north).multiplyScalar(Math.cos(c.heading)).addScaledVector(east,Math.sin(c.heading));
    const v=sp.speed*(sp.hop?Math.max(0,Math.sin(c.t*4+c.ph))*1.6:1)*dt;
    c.lat+=Math.cos(c.heading)*v/R;c.lon+=Math.sin(c.heading)*v/R/Math.cos(c.lat);
    const n=fromLL(c.lat,c.lon,1);let h=Math.max(T.terrain(n.x,n.y,n.z,.5),0);
    if(sp.fly){const want=h+c.alt;c.y=c.y===undefined?want:c.y+(want-c.y)*Math.min(1,dt*.8);h=c.y+Math.sin(c.t*1.3+c.ph)*.4;}
    else if(sp.hop)h+=Math.max(0,Math.sin(c.t*4+c.ph))*.5;
    const p=fromLL(c.lat,c.lon,R+h);c.obj.position.set(p.x-cam.x,p.y-cam.y,p.z-cam.z);
    _rgt.crossVectors(_fwd,up);_mat.makeBasis(_fwd,up,_rgt);c.obj.quaternion.setFromRotationMatrix(_mat);
    const o=c.obj;
    if(o.legs){o.legs.forEach((l,k)=>{l.rotation.z=Math.sin(c.t*5+k*1.57)*.5;});}
    if(o.wings){o.wings.forEach(w=>{if(sp===SPECIES.dragonfly)w.rotation.x=-1.57+Math.sin(c.t*40)*.5*Math.sign(w.userData.z);else w.rotation.x=Math.sin(c.t*4+c.ph)*.6*w.userData.s;});}
    if(o.bell){const sq=1+Math.sin(c.t*2.2+c.ph)*.12;o.bell.scale.set(1/Math.sqrt(sq),sq,1/Math.sqrt(sq));}
    if(o.fins){o.fins.forEach((f,k)=>{f.rotation.y=Math.sin(c.t*6+k*3.14)*.4;});}
    if(o.segs){const em=Math.sin(c.t*.35+c.ph);o.segs.forEach((sg,k)=>{const ph=c.t*2.5-k*.55;sg.position.y=Math.sin(ph)*1.4+(em*6-k*1.2)*(em>0?1:1.6);sg.position.z=Math.sin(ph*.5)*.6;});}
  }
}

let nid=0;
class Node{constructor(f,u0,v0,size,level,parent){this.f=f;this.u0=u0;this.v0=v0;this.size=size;this.level=level;this.parent=parent;this.id=nid++;this.kids=null;this.mesh=null;this.state=0;/*0 none,1 loading,2 ready*/this.dead=false;
  const d=cubeDirJ(f,u0+size/2,v0+size/2);this.c=d;this.span=size*Math.PI/2*R/2;this.rad=this.span*.75;this.lastUse=0;this.hc=level<6?0:Math.max(T.terrain(d[0],d[1],d[2],Math.max(this.span/4,2)),0);}
  request(prio){if(this.state)return;this.state=1;queue.push({prio,node:this,msg:{id:this.id,f:this.f,u0:this.u0,v0:this.v0,size:this.size,level:this.level},cb:d=>this.build(d)});pump();}
  build(d){if(this.dead)return;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(d.pos,3));g.setAttribute('normal',new THREE.BufferAttribute(d.nor,3));g.setAttribute('dir',new THREE.BufferAttribute(d.dir,3));g.setAttribute('hgt',new THREE.BufferAttribute(d.hgt,1));g.setAttribute('hz0',new THREE.BufferAttribute(d.hz0,4));g.setAttribute('hz1',new THREE.BufferAttribute(d.hz1,4));g.setIndex(new THREE.BufferAttribute(d.index,1));
    g.boundingSphere=new THREE.Sphere(new THREE.Vector3(),this.span*.8+Math.max(d.maxH-d.minH,10));
    const m=new THREE.Mesh(g,terrainMat);m.frustumCulled=true;m.userData.node=this;m.visible=false;
    m.onBeforeRender=(r,s,c,geo,mat)=>{if(!mat.uniforms||!mat.uniforms.uTileModA)return;mat.uniforms.uTileModA.value.set(modP(this.cx,4096),modP(this.cy,4096),modP(this.cz,4096));mat.uniforms.uTileModB.value.set(modP(this.cx,262144),modP(this.cy,262144),modP(this.cz,262144));mat.uniformsNeedUpdate=true;};
    this.cx=d.cx;this.cy=d.cy;this.cz=d.cz;this.maxH=d.maxH;this.mesh=m;planet.add(m);this.state=2;
    if(d.flora){this.coll=makeColliders(d.flora);this.flora=buildFlora(d.flora,this.span);if(this.flora){this.flora.visible=false;this.flora.userData.node=this;flora.add(this.flora);}}}
  split(){if(this.kids)return;const h=this.size/2;this.kids=[new Node(this.f,this.u0,this.v0,h,this.level+1,this),new Node(this.f,this.u0+h,this.v0,h,this.level+1,this),new Node(this.f,this.u0,this.v0+h,h,this.level+1,this),new Node(this.f,this.u0+h,this.v0+h,h,this.level+1,this)];}
  dispose(){this.dead=true;if(this.mesh){planet.remove(this.mesh);this.mesh.geometry.dispose();this.mesh=null;}if(this.flora){flora.remove(this.flora);this.flora.traverse(o=>{if(o.isInstancedMesh)o.dispose();});this.flora=null;}if(this.kids){for(const k of this.kids)k.dispose();this.kids=null;}this.state=0;}
}
const modP=(x,p)=>x-Math.floor(x/p)*p;
function cubeDirJ(f,u,v){const a=Math.tan(u*Math.PI/4),b=Math.tan(v*Math.PI/4);let x,y,z;switch(f){case 0:x=1;y=b;z=-a;break;case 1:x=-1;y=b;z=a;break;case 2:x=a;y=1;z=-b;break;case 3:x=a;y=-1;z=b;break;case 4:x=a;y=b;z=1;break;default:x=-a;y=b;z=-1;}const l=Math.sqrt(x*x+y*y+z*z);return [x/l,y/l,z/l];}
const roots=[];for(let f=0;f<6;f++)roots.push(new Node(f,-1,-1,2,0,null));
let frameNo=0,visibleTiles=0;
/* camera position in planet frame, doubles */
const cam={x:0,y:0,z:R*3};
function distToNode(n){const r=R+n.hc;const dx=n.c[0]*r-cam.x,dy=n.c[1]*r-cam.y,dz=n.c[2]*r-cam.z;return Math.max(Math.sqrt(dx*dx+dy*dy+dz*dz)-n.rad,0);}
let leafLevel=0,leafSpan=1e6,camLeafSpan=1e6;
function updateTree(){leafLevel=0;leafSpan=1e6;
  visibleTiles=0;const camLen=Math.sqrt(cam.x*cam.x+cam.y*cam.y+cam.z*cam.z);const horHere=Math.acos(Math.min(1,R/camLen));
  for(const o of planet.children)o.visible=false;for(const o of flora.children)o.visible=false;
  const visit=(n)=>{
    n.lastUse=frameNo;
    const d=distToNode(n);
    // horizon: a tile is hidden when even its highest point sits below the viewer's horizon
    if(n.level>2){const dot=Math.max(-1,Math.min(1,(n.c[0]*cam.x+n.c[1]*cam.y+n.c[2]*cam.z)/camLen));const mh=n.maxH!==undefined?Math.max(n.maxH,0)+80:9000;
      if(Math.acos(dot)-n.span*.8/R>horHere+Math.acos(R/(R+mh)))return;}
    if(n.flora&&d<(n.level===12?9000:n.level===14?1300:260)){n.flora.visible=true;n.flora.userData.d=d;}
    const want=n.level<MAXL&&d<n.span*quality.lod;
    if(!n.mesh)n.request(d);
    if(want){n.split();let allReady=true;for(const k of n.kids){k.lastUse=frameNo;if(k.state!==2)allReady=false;}
      if(allReady){for(const k of n.kids)visit(k);if(n.mesh)n.mesh.visible=false;return;}
      for(const k of n.kids){if(!k.state)k.request(d*0.5+k.level);}

function sunVec(deg){const a=deg*Math.PI/180;return new THREE.Vector3(Math.cos(a),0.33*Math.sin(a*.5+.4),Math.sin(a)).normalize();}
function findSpot(kind,sunDeg,seed){
  const sun=sunVec(sunDeg);let s=seed;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647;};let best=null,bs=-1e9;
  for(let i=0;i<3000;i++){
    const z=rnd()*2-1,a=rnd()*6.2832,r=Math.sqrt(1-z*z);const d=new THREE.Vector3(r*Math.cos(a),r*Math.sin(a),z);
    const el=d.dot(sun);if(el<.3)continue;const h=T.terrain(d.x,d.y,d.z,5000);
    const ll=toLL(d.x,d.y,d.z);if(Math.abs(ll.lat)>1.2)continue;
    const {east,north}=frameAt(ll.lat,ll.lon);let mh=-1e9,mdir=null;
    const rr=kind==='valley'?.0006:.004;for(let k=0;k<12;k++){const ang=k/12*6.2832;const o=d.clone().addScaledVector(east,Math.cos(ang)*rr).addScaledVector(north,Math.sin(ang)*rr).normalize();const hh=T.terrain(o.x,o.y,o.z,5000);if(hh>mh){mh=hh;mdir=o;}}
    let sc;
    if(kind==='shore'){if(h<-5||h>40)continue;sc=mh/500-Math.abs(el-.55)*2;}
    else if(kind==='valley'){if(h<60||h>1200||mh-h<200)continue;sc=(mh-h)/400-Math.abs(el-.55)*2;}
    else{if(h<300||h>1800||mh>2600)continue;sc=(mh-h)/1000-Math.abs(el-.6)*2;}
    if(sc>bs){bs=sc;best={d,mdir,h,mh};}
  }
  return best;
}

const sunFor=lonDeg=>((lonDeg+28)%360+360)%360;   // morning light wherever you land
const place=(la,lo,heading=0,pitch=.03)=>()=>{const [a,b]=landNear(la*D2R,lo*D2R);return {mode:'ground',lat:a,lon:b,heading,pitch,sun:sunFor(lo)};};

,"r":"east","s":"东之大陆内陆的远古丛林，“天国”的入口。"},{"id":"south","n":"南方未探索区","la":-52,"lo":-18,"r":"south","s":"印加虫群乘空艇离开时飞去的方向。"}];
const T1=new Set(['north','west','east','south']),TS=new Set(['origin','mistsea','icesea']);
const T2=new Set(['landing','desert','jungle','hometree','spires','canyon','rift','emeraldcity','longqimu','scorpion','skull','fungus','silvercity','capital','tianguo','cloudpeak','whiteisle','salt','peak','isles','jadeport','dieye','twin','abyss','jjzs','inca_pit','atmount','crystalwood']);
const GROUPS=[['north','北之大陆'],['west','西之大陆 · 恐龙大陆'],['east','东之大陆'],['sea','海洋与岛屿'],['pole','极北'],['south','南方']];
const RNAME=Object.fromEntries(GROUPS);
const regionOf=p=>p.r==='ud'?'north':(p.r||'sea');
const MW=1440,MH=720;let mapReady=false;
function renderBaseMap(){
  const w=new Worker(URL.createObjectURL(new Blob([TERRAIN_SRC+`onmessage=()=>{const W=${MW},H=${MH};const px=new Uint8ClampedArray(W*H*4);const HH=new Float32Array(W*H);
    for(let j=0;j<H;j++)for(let i=0;i<W;i++){const lat=(0.5-(j+.5)/H)*Math.PI,lon=((i+.5)/W-0.5)*2*Math.PI;HH[j*W+i]=terrain(Math.cos(lat)*Math.cos(lon),Math.sin(lat),Math.cos(lat)*Math.sin(lon),30000);}
    const L=(a,b,t)=>{t=Math.max(0,Math.min(1,t));return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];};
    const DEEP=[11,28,48],MID=[18,54,81],SHAL=[47,118,132],LOW=[96,125,63],FOR=[50,90,52],HIGH=[143,122,92],PEAK=[208,198,181],SAND=[201,173,120],SNOW=[233,238,243];
    const at=(i,j)=>HH[Math.min(H-1,Math.max(0,j))*W+((i+W)%W)];
    for(let j=0;j<H;j++)for(let i=0;i<W;i++){const lat=(0.5-(j+.5)/H)*Math.PI,lon=((i+.5)/W-0.5)*2*Math.PI;const x=Math.cos(lat)*Math.cos(lon),y=Math.sin(lat),z=Math.cos(lat)*Math.sin(lon);
      const h=HH[j*W+i];const hl=at(i-1,j),hr=at(i+1,j),hu=at(i,j-1),hd=at(i,j+1);let c;
      if(h<=0){const d=-h;c=d<400?L(SHAL,MID,d/400):L(MID,DEEP,(d-400)/2200);const band=Math.floor(d/650)%2?.955:1;c=[c[0]*band,c[1]*band,c[2]*band];
        if(hl>0||hr>0||hu>0||hd>0)c=L(c,[128,196,200],.5);
        const ie=.935+.025*fbm(x*9+3,y*9,z*9+1,4);const ice=sm(ie,ie+.02,Math.abs(y))*(y>0?1:.8);if(ice>0)c=L(c,SNOW,ice*.92);}
      else{const dry=dryness(x,y,z),m=moisture(x,y,z);const t=Math.min(1,h/4200);
        c=t<.35?L(LOW,HIGH,t/.35):L(HIGH,PEAK,(t-.35)/.65);
        c=L(c,FOR,Math.min(1,Math.max(0,(m-.42)*3))*Math.max(0,1-t*1.6));
        if(dry>.2)c=L(c,SAND,(dry-.2)*2);
        if(h>4300-3600*y*y)c=SNOW;
        const sh=Math.max(.62,Math.min(1.38,1+((hl-hr)+(hu-hd))*.00032));c=[c[0]*sh,c[1]*sh,c[2]*sh];
        const cl=Math.floor(h/700);if(cl!==Math.floor(hr/700)||cl!==Math.floor(hd/700))c=[c[0]*.86,c[1]*.86,c[2]*.86];
        if(hl<=0||hr<=0||hu<=0||hd<=0)c=[c[0]*.72,c[1]*.72,c[2]*.72];}
      const o=(j*W+i)*4;px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=255;}
    postMessage(px,[px.buffer]);};`],{type:'text/javascript'})));
  w.onmessage=e=>{const cv=$('#mapc'),x=cv.getContext('2d');x.putImageData(new ImageData(e.data,MW,MH),0,0);
    x.lineWidth=1;for(let la=-60;la<=60;la+=30){const y=(.5-la/180)*MH;x.strokeStyle=la===0?'rgba(233,207,152,.22)':'rgba(255,255,255,.07)';x.setLineDash(la===0?[6,6]:[]);x.beginPath();x.moveTo(0,y);x.lineTo(MW,y);x.stroke();}
    x.setLineDash([]);x.strokeStyle='rgba(255,255,255,.07)';for(let lo=-150;lo<=150;lo+=30){const X=(lo/360+.5)*MW;x.beginPath();x.moveTo(X,0);x.lineTo(X,MH);x.stroke();}
    mapReady=true;$('#mapLoading').hidden=true;w.terminate();};
  w.postMessage(0);
}
setTimeout(renderBaseMap,1200);

/* pins + gazetteer */
const pinEls={},giEls={};let selected=null;
{const pins=$('#pins'),list=$('#gazList');
 for(const p of PLACES){if(p.id==='rongqiu')continue;
   const el=document.createElement('div');el.className='pin '+(T1.has(p.id)?'t1':TS.has(p.id)?'ts':T2.has(p.id)?'t2':'t3');el.dataset.id=p.id;
   el.style.left=((p.lo/360+.5)*100)+'%';el.style.top=((.5-p.la/180)*100)+'%';
   el.innerHTML=`<div class="in"><i title="${p.n}"></i><span>${p.n}</span></div>`;pins.appendChild(el);pinEls[p.id]=el;}
 for(const [g,gn] of GROUPS){const items=PLACES.filter(p=>p.id!=='rongqiu'&&regionOf(p)===g);if(!items.length)continue;
   const sec=document.createElement('section');sec.innerHTML=`<h4>${gn}<span>${items.length}</span></h4>`;
   for(const p of items){const b=document.createElement('button');b.type='button';b.className='gi';b.dataset.id=p.id;b.innerHTML=`${p.n}<small>${p.s||''}</small>`;
     b.addEventListener('click',()=>selectPlace(p.id,true));sec.appendChild(b);giEls[p.id]=b;}
   list.appendChild(sec);}
 $('#search').addEventListener('input',e=>{const q=e.target.value.trim();for(const sec of list.children){let any=false;for(const b of sec.querySelectorAll('.gi')){const p=PLACES.find(x=>x.id===b.dataset.id);const ok=!q||p.n.includes(q)||(p.s||'').includes(q);b.hidden=!ok;if(ok)any=true;}sec.hidden=!any;}});

let target=null;
function showCard(region,name,desc,meta){$('#cRegion').textContent=region;$('#cName').textContent=name;$('#cDesc').textContent=desc;$('#cMeta').textContent=meta;$('#card').hidden=false;}
const fmtLL=(la,lo)=>`${Math.abs(la).toFixed(1)}°${la>=0?'N':'S'} · ${Math.abs(lo).toFixed(1)}°${lo>=0?'E':'W'}`;
function selectPlace(id,center){const p=PLACES.find(x=>x.id===id);if(!p)return;
  if(selected){pinEls[selected]?.classList.remove('sel');giEls[selected]?.classList.remove('sel');}
  selected=id;pinEls[id]?.classList.add('sel');const gi=giEls[id];if(gi){gi.classList.add('sel');gi.scrollIntoView({block:'nearest'});}
  target={la:p.la,lo:p.lo,n:p.n};showCard(RNAME[regionOf(p)]||'',p.n,p.s||'',fmtLL(p.la,p.lo));
  if(center)centerOn(p.la,p.lo,T1.has(id)?1.6:2.6);}
function selectSpot(la,lo){if(selected){pinEls[selected]?.classList.remove('sel');giEls[selected]?.classList.remove('sel');selected=null;}
  const d=describe(la*D2R,lo*D2R);const np=nearestPlace(la*D2R,lo*D2R);
  target={la,lo,n:d.terr};
  showCard(d.region,'未标注的'+d.terr,np.dkm<1500?`距${np.p.n}约 ${Math.round(np.dkm)} km，在它的${np.dir}方。`:'远离书中记载的任何地点。',fmtLL(la,lo));}
$('#cGo').addEventListener('click',()=>{if(target)goPlace(target);});

/* pan / zoom */
const mz={z:1,tx:0,ty:0,ww:0,wh:0,sw:0,sh:0};
function fitMap(){const r=$('#stage').getBoundingClientRect();mz.sw=r.width;mz.sh=r.height;mz.ww=Math.min(r.width,r.height*2);mz.wh=mz.ww/2;
  const w=$('#world');w.style.width=mz.ww+'px';w.style.height=mz.wh+'px';clampMap();applyMapT();}
function clampMap(){const W=mz.ww*mz.z,H=mz.wh*mz.z;mz.tx=W<=mz.sw?(mz.sw-W)/2:Math.min(0,Math.max(mz.sw-W,mz.tx));mz.ty=H<=mz.sh?(mz.sh-H)/2:Math.min(0,Math.max(mz.sh-H,mz.ty));}
function applyMapT(){const w=$('#world');w.style.transform=`translate(${mz.tx}px,${mz.ty}px) scale(${mz.z})`;w.style.setProperty('--iz',String(1/mz.z));w.dataset.z=mz.z<1.7?'1':mz.z<3.2?'2':'3';}
function zoomAt(z,sx,sy){const nz=Math.min(9,Math.max(1,z));const wx=(sx-mz.tx)/mz.z,wy=(sy-mz.ty)/mz.z;mz.z=nz;mz.tx=sx-wx*nz;mz.ty=sy-wy*nz;clampMap();applyMapT();}
function centerOn(la,lo,z){mz.z=Math.min(9,Math.max(mz.z,z||1));const wx=(lo/360+.5)*mz.ww,wy=(.5-la/180)*mz.wh;mz.tx=mz.sw/2-wx*mz.z;mz.ty=mz.sh/2-wy*mz.z;clampMap();applyMapT();}
{const st=$('#stage');const ptrs=new Map();let down=null,pz=null;
 st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
   if(ptrs.size===2){const [a,b]=[...ptrs.values()];pz={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:mz.z};down=null;}
   else down={x:e.clientX,y:e.clientY,tx:mz.tx,ty:mz.ty,moved:false,target:e.target};});
 st.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});const r=st.getBoundingClientRect();
   if(pz&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoomAt(pz.z*Math.hypot(a.x-b.x,a.y-b.y)/pz.d,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return;}
   if(down){const dx=e.clientX-down.x,dy=e.clientY-down.y;if(!down.moved&&Math.hypot(dx,dy)>5){down.moved=true;st.classList.add('drag');}
     if(down.moved){mz.tx=down.tx+dx;mz.ty=down.ty+dy;clampMap();applyMapT();}}});
 const up=e=>{ptrs.delete(e.pointerId);st.classList.remove('drag');if(ptrs.size<2)pz=null;
   if(down&&!down.moved&&e.type==='pointerup'){const pin=down.target.closest&&down.target.closest('.pin');
     if(pin)selectPlace(pin.dataset.id,false);
     else{const r=$('#world').getBoundingClientRect();const lo=((e.clientX-r.left)/r.width-.5)*360,la=(.5-(e.clientY-r.top)/r.height)*180;if(Math.abs(la)<88&&Math.abs(lo)<=180)selectSpot(la,lo);}}
   down=null;};
 st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
 st.addEventListener('wheel',e=>{e.preventDefault();const r=st.getBoundingClientRect();zoomAt(mz.z*Math.exp(-Math.max(-120,Math.min(120,e.deltaY))*.0028),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 $('#zIn').addEventListener('click',()=>zoomAt(mz.z*1.5,mz.sw/2,mz.sh/2));$('#zOut').addEventListener('click',()=>zoomAt(mz.z/1.5,mz.sw/2,mz.sh/2));
 $('#zMe').addEventListener('click',()=>centerOn(view.lat/D2R,view.lon/D2R,3));}

/* live layers: night side, sun, moon, you */
const MOON_WORDS=[[.06,'满月'],[.19,'亏凸月'],[.31,'下弦月'],[.44,'残月'],[.56,'新月'],[.69,'蛾眉月'],[.81,'上弦月'],[.94,'盈凸月'],[1.01,'满月']];
function moonWord(){const f=((gameH/24/8)%1+1)%1;return MOON_WORDS.find(m=>f<m[0])[1];}
const nightCv=$('#night'),nightX=nightCv.getContext('2d'),nightImg=nightX.createImageData(360,180);
function updateMapLive(){const S=uni.uSun.value,M=uni.uMoon.value,d=nightImg.data;
  for(let j=0;j<180;j++){const lat=(.5-(j+.5)/180)*Math.PI,cl=Math.cos(lat),sl=Math.sin(lat);
    for(let i=0;i<360;i++){const lon=((i+.5)/360-.5)*2*Math.PI;const el=cl*Math.cos(lon)*S.x+sl*S.y+cl*Math.sin(lon)*S.z;
      const night=Math.min(1,Math.max(0,(.03-el)/.14));const bq=(el+.01)/.035,band=Math.exp(-bq*bq)*(1-night);const o=(j*360+i)*4;
      d[o]=230*(1-night)+3*night;d[o+1]=130*(1-night)+7*night;d[o+2]=60*(1-night)+22*night;d[o+3]=Math.max(night*.7,band*.16)*255;}}
  nightX.putImageData(nightImg,0,0);
